# Built-in defaults — the lowest precedence layer (ARCHITECTURE.md §4).
# Override per user (~/.config/batonai/config.yaml) or per project (.ai/config.yaml).

pipeline:
  stages: [planner, designer, coder, tester, reviewer, publisher]
  # ADR-015: consecutive stages on the SAME provider (by default: planner
  # and reviewer are both codex) resume each other's session instead of
  # cold-starting, cutting redundant repo re-exploration. Never crosses
  # providers. Disable per project if you want stages fully independent:
  # pipeline: {session_chaining: false}
  session_chaining: true
  # ADR-023: on a NEEDS WORK verdict, run exactly one automatic fix pass (re-run
  # the Coder with the review findings, then re-review, then stop). Off by
  # default — it spends an extra Coder+Reviewer turn. Opt in here or with
  # `batonai run --fix-loop`. The manual cousin is `batonai revise`.
  fix_loop: false

# Quota spread by design (ADR-016): the deep, chained pair (planner+reviewer)
# sits on codex; claude is always alone on coder; the designer runs on
# antigravity. The publisher — the shallowest job (drafting text from a diff) —
# runs on opencode pointed at a free tier (ADR-017), taking it off the paid
# pools entirely. Same total work, spread across separate pools.
roles:
  planner:
    provider: codex
  designer:
    provider: antigravity
    enabled: false # optional stage, off by default
  coder:
    provider: claude
  tester:
    provider: testrunner # zero-LLM: runs the project's tests (ADR-024)
    enabled: false # optional stage, off by default — enable with --with-tester
  reviewer:
    provider: codex
  publisher:
    provider: opencode # free-tier client for shallow text (ADR-017); independent
    # of the coder's provider by design (ADR-014) — override freely per project
    enabled: false # optional stage, off by default — prepares commit/PR drafts only,
    # never runs git itself. Enable per project: roles: {publisher: {enabled: true}}

providers:
  claude:
    command: claude
    model: null
    timeout_s: 900
  codex:
    command: codex
    timeout_s: 600
  antigravity:
    command: agy # Gemini CLI retired for personal accounts 2026-06-18 (ADR-012)
    timeout_s: 600
  opencode:
    command: opencode
    model: null # e.g. "openrouter/<:free model>"; point at a backend via `opencode auth`
    timeout_s: 600 # free client — model comes from a user-configured free tier (ADR-017)
  deterministic:
    command: git # zero-LLM publisher floor (ADR-018): commit message from `git status` (sees new files too)
    timeout_s: 60 # no model, no quota; select per project: roles: {publisher: {provider: deterministic}}
  testrunner:
    command: auto # zero-LLM tester (ADR-024): auto-detect the test command (pytest/npm test/…)
    timeout_s: 600 # override per project: providers: {testrunner: {command: "uv run pytest"}}

context:
  project_profile: .ai/project.md
  health: false # opt-in: inject repowise code-health hotspots into stage prompts (ADR-025)
