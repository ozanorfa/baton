# Built-in defaults — the lowest precedence layer (ARCHITECTURE.md §4).
# Override per user (~/.config/ai-orchestrator/config.yaml) or per project (.ai/config.yaml).

pipeline:
  stages: [planner, designer, coder, reviewer, publisher]
  # ADR-015: consecutive stages on the SAME provider (by default: planner,
  # reviewer, publisher are all codex) resume each other's session instead
  # of cold-starting, cutting redundant repo re-exploration. Never crosses
  # providers. Disable per project if you want stages fully independent:
  # pipeline: {session_chaining: false}
  session_chaining: true

roles:
  planner:
    provider: codex
  designer:
    provider: antigravity
    enabled: false # optional stage, off by default
  coder:
    provider: claude
  reviewer:
    provider: codex
  publisher:
    provider: codex # independent of the coder's provider by design (ADR-014)
    enabled: false # optional stage, off by default — prepares commit/PR drafts only,
    # never runs git itself. Enable per project: roles: {publisher: {enabled: true}}

providers:
  claude:
    command: claude
    model: null
    timeout_s: 900
  codex:
    command: codex
    timeout_s: 600
  antigravity:
    command: agy # Gemini CLI retired for personal accounts 2026-06-18 (ADR-012)
    timeout_s: 600

context:
  project_profile: .ai/project.md
