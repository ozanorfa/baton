# Built-in defaults — the lowest precedence layer (ARCHITECTURE.md §4).
# Override per user (~/.config/ai-orchestrator/config.yaml) or per project (.ai/config.yaml).

pipeline:
  stages: [planner, designer, coder, reviewer, publisher]
  # ADR-015: consecutive stages on the SAME provider (by default: planner
  # and reviewer are both codex) resume each other's session instead of
  # cold-starting, cutting redundant repo re-exploration. Never crosses
  # providers. Disable per project if you want stages fully independent:
  # pipeline: {session_chaining: false}
  session_chaining: true

# Quota spread by design (ADR-016): the deep, chained pair (planner+reviewer)
# sits on codex; claude is always alone on coder; the two shallow, bounded
# jobs (designer, publisher) share antigravity. Same total work, spread
# across three separate subscription pools instead of concentrated on one.
roles:
  planner:
    provider: codex
  designer:
    provider: antigravity
    enabled: false # optional stage, off by default
  coder:
    provider: claude
  reviewer:
    provider: codex
  publisher:
    provider: antigravity # quota-spread pair with designer (ADR-016); independent
    # of the coder's provider by design (ADR-014) — override freely per project
    enabled: false # optional stage, off by default — prepares commit/PR drafts only,
    # never runs git itself. Enable per project: roles: {publisher: {enabled: true}}

providers:
  claude:
    command: claude
    model: null
    timeout_s: 900
  codex:
    command: codex
    timeout_s: 600
  antigravity:
    command: agy # Gemini CLI retired for personal accounts 2026-06-18 (ADR-012)
    timeout_s: 600

context:
  project_profile: .ai/project.md
