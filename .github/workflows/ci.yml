name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
        # unit + contract (recorded real CLI fixtures) + integration (fake
        # provider) — the whole suite is designed to run with zero AI access
      - run: uv build
        # packaging must stay valid between releases, not be discovered on tag day
